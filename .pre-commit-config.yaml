# Install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: project-checks
        name: project checks
        language: system
        entry: scripts/checks/hook.sh
        require_serial: true
        # Without this a passing commit would hide the report.
        verbose: true
        pass_filenames: false
        # A commit that only deletes files would otherwise skip the hook.
        always_run: true

      - id: prettier-markdown
        name: prettier (markdown)
        language: node
        additional_dependencies: ["prettier@3.9.10"]
        entry: prettier --write --ignore-unknown
        types: [markdown]
