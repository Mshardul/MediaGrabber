name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mon 06:17 UTC — Xcode-latest canary

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Without this, a later mise command installs every pinned tool, not only the ones a job asks for.
  MISE_AUTO_INSTALL: 'false'

jobs:
  lint:
    # Checks need no Xcode, so they stay off macOS; ubuntu-24.04 because the pinned SwiftLint cannot load the libxml2 of ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: jdx/mise-action@v2
        with:
          working_directory: .
          install_args: swiftformat swiftlint shellcheck shfmt
      - run: make venv
      - run: scripts/tests/test_checks.sh
      - run: make check-all CHECK_ARGS="--summary-base=$SUMMARY_BASE --summary-file=$GITHUB_STEP_SUMMARY"
        env:
          SUMMARY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: xcodever
        run: echo "v=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM / DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: spm-${{ matrix.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ matrix.os }}-
      - uses: jdx/mise-action@v2
        with:
          working_directory: .
          install_args: tuist
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ github.event_name == 'schedule' && 'latest' || steps.xcodever.outputs.v }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: make venv
      - run: make plugin-test
      # The check job runs the excluded test, beside the checks it covers.
      - run: make scripts-test SCRIPT_TEST_ARGS="--exclude test_checks.sh"
      - run: mise exec -- tuist test MediaGrabber-Workspace -- -enableCodeCoverage YES
      - name: Collect xcresult
        if: always()
        run: |
          r="$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -path '*MediaGrabber*' \
            | sort | tail -1)"
          test -n "$r" || { echo "no xcresult produced" >&2; exit 1; }
          cp -R "$r" "$RUNNER_TEMP/Result.xcresult"
      - name: Coverage summary
        run: |
          result="$RUNNER_TEMP/Result.xcresult"
          xcrun xccov view --report --json "$result" > "$RUNNER_TEMP/cov.json"
          python3 - "$RUNNER_TEMP/cov.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          rows = {t["name"]: t for t in d.get("targets", [])}
          def line(match, label):
              t = next((v for k, v in rows.items() if k.startswith(match)), None)
              if not t:
                  return f"| {match} | _no data_ | | {label} |"
              pct = t.get("lineCoverage", 0) * 100
              cov, ex = t.get("coveredLines", 0), t.get("executableLines", 0)
              return f"| {match} | {pct:.1f}% | {cov}/{ex} | {label} |"
          print("### MediaGrabber coverage")
          print()
          print("| Target | Line coverage | Lines | Note |")
          print("|---|---|---|---|")
          print(line("GrabberKit", "**headline**"))
          print(line("MediaGrabber", "informational (SwiftUI view code)"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresult-${{ matrix.os }}
          path: ${{ runner.temp }}/Result.xcresult
          if-no-files-found: warn
