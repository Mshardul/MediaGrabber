name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'bare version, e.g. 0.1.0'
        required: true
      dry_run:
        description: 'build and package but do not publish'
        type: boolean
        default: false
      overwrite:
        description: 'allow replacing an existing release for this version'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/release/derive-version.sh

      - name: Tag commit must be on main
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "built commit is not on origin/main" >&2; exit 1; }

      - id: xcodever
        run: echo "v=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      # Pin: jdx/mise-action@v2 → c37c93293d6b742fc901e1406b8f764f6fb19dac
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      # Pin: maxim-lobanov/setup-xcode@v1 → ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: ${{ steps.xcodever.outputs.v }}

      - name: Bundle the downloader and media tools
        run: scripts/fetch-tools.sh

      - name: Build Release
        env:
          TUIST_MG_VERSION: ${{ steps.version.outputs.version }}
          TUIST_SPARKLE_PUBLIC_KEY: ${{ vars.MG_SPARKLE_PUBLIC_KEY }}
        run: |
          mise exec -- tuist generate --no-open
          xcodebuild -workspace MediaGrabber.xcworkspace -scheme MediaGrabber \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            build

      - name: Locate and sign the app
        id: app
        env:
          MG_SIGN_IDENTITY: ${{ vars.MG_SIGN_IDENTITY }}
        run: |
          app="build/Build/Products/Release/MediaGrabber.app"
          test -d "$app" || { echo "MediaGrabber.app not found at $app" >&2; exit 1; }
          scripts/sign-app.sh "$app" "${MG_SIGN_IDENTITY:--}"
          echo "path=$app" >> "$GITHUB_OUTPUT"

      - name: Verify the app signature and update key
        env:
          APP: ${{ steps.app.outputs.path }}
          EXPECTED_KEY: ${{ vars.MG_SPARKLE_PUBLIC_KEY }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: scripts/release/verify-app.sh "$APP"

      - name: End-to-end run on the signed app
        env:
          APP: ${{ steps.app.outputs.path }}
          MG_E2E_LAUNCH: 1
        run: scripts/e2e/run.sh "$APP"

      - name: Package DMG and sources
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP: ${{ steps.app.outputs.path }}
        run: |
          assets="$(mktemp -d)"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          scripts/release/package-dmg.sh "$APP" "$VERSION" "$assets"

      - name: Verify DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.assets }}/MediaGrabber-${{ steps.version.outputs.version }}.dmg
        run: scripts/release/verify-dmg.sh "$DMG" "$VERSION"

      - name: Sign the disk image for Sparkle
        id: sparkle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.assets }}/MediaGrabber-${{ steps.version.outputs.version }}.dmg
          ASSETS: ${{ steps.dmg.outputs.assets }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: scripts/release/sign-update.sh "$DMG" "$VERSION" "$ASSETS"

      - name: Check the signature against the appcast
        if: ${{ steps.sparkle.outputs.signed == 'true' }}
        env:
          APPCAST: ${{ steps.dmg.outputs.assets }}/appcast.xml
          APP: ${{ steps.app.outputs.path }}
          DMG: ${{ steps.dmg.outputs.assets }}/MediaGrabber-${{ steps.version.outputs.version }}.dmg
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/check-signature.sh --appcast "$APPCAST" --app "$APP" --dmg "$DMG" --version "$VERSION"

      - name: Publish release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: release-notes/${{ steps.version.outputs.version }}.md
          ASSETS: ${{ steps.dmg.outputs.assets }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite }}
        run: |
          args=(--version "$VERSION" --notes "$NOTES" --assets-dir "$ASSETS")
          [ "$OVERWRITE" = "true" ] && args+=(--overwrite)
          scripts/release/publish-release.sh "${args[@]}"
